<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071426">
<title>CoinSprout — Crypto Rewards</title>
<style>
:root{color-scheme:dark;--bg:#071426;--panel:#102740;--panel2:#0c2035;--line:#1d4966;--cyan:#14b8d4;--cyan2:#39d7f2;--muted:#8fadc3;--white:#f4fbff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#102d48 0,#071426 52%);color:var(--white);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
.wrap{width:min(100% - 28px,520px);margin:auto;padding:22px 0 96px}.top{display:flex;align-items:center;gap:12px;margin:4px 0 24px}.logo{width:48px;height:48px;border-radius:16px;background:#123a57;display:grid;place-items:center;color:var(--cyan2);font-size:27px;box-shadow:inset 0 0 0 1px #23617b}.brand{font-size:21px;font-weight:800;letter-spacing:.2px}.sub{font-size:12px;color:var(--muted);margin-top:2px}.pill{margin-left:auto;border:1px solid var(--line);color:var(--cyan2);border-radius:99px;padding:6px 10px;font-size:11px;white-space:nowrap}
.balance{background:linear-gradient(140deg,#12324d,#0d2238);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 16px 44px #0002}.eyebrow{color:#a6c6db;font-size:13px}.amount{font-size:clamp(27px,7vw,36px);font-weight:800;letter-spacing:-.8px;margin:8px 0 4px}.secure{font-size:12px;color:var(--cyan2);display:flex;align-items:center;gap:6px;margin-bottom:20px}.claim{display:block;width:100%;border:0;border-radius:14px;background:linear-gradient(90deg,#14b8d4,#39d7f2);color:#041522;font-weight:800;font-size:16px;padding:15px;cursor:pointer;box-shadow:0 8px 22px #14b8d426}.claim:active,.tile:active{transform:scale(.99)}.note{text-align:center;color:var(--muted);font-size:11px;margin-top:10px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0 25px}.stat{background:#0c2035;border:1px solid #173a54;border-radius:16px;padding:14px}.stat-label{font-size:12px;color:var(--muted)}.stat-val{font-size:18px;font-weight:750;margin-top:5px}.section-title{font-size:16px;font-weight:800;margin:24px 0 12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.tile{border:1px solid #1d4966;border-radius:18px;background:linear-gradient(145deg,#102740,#0c2035);padding:17px 15px;min-height:125px;text-align:left;color:var(--white);cursor:pointer;transition:transform .12s}.tile .ico{font-size:24px;color:var(--cyan2);margin-bottom:12px}.tile strong{display:block;font-size:15px}.tile span{display:block;color:var(--muted);font-size:12px;margin-top:4px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#071426ed;backdrop-filter:blur(12px);border-top:1px solid #173a54;padding:10px max(14px,calc((100vw - 520px)/2));display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.nav{background:none;border:0;color:var(--muted);font-size:11px;padding:7px 2px;cursor:pointer}.nav b{display:block;font-size:19px;margin-bottom:2px;font-weight:500}.nav.active{color:var(--cyan2)}.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);width:min(90%,420px);background:#14334b;border:1px solid #2b6681;border-radius:14px;padding:13px 15px;box-shadow:0 12px 35px #0005;display:none;font-size:13px}.toast.show{display:block}.footer{text-align:center;color:#65839a;font-size:11px;margin-top:26px}
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <div class="logo" aria-hidden="true">🌱</div>
    <div><div class="brand">CoinSprout</div><div class="sub">Your crypto rewards hub</div></div>
    <div class="pill">● DEMO</div>
  </header>

  <section class="balance" aria-label="Demo wallet balance">
    <div class="eyebrow">Available balance</div>
    <div class="amount">0.00000000 <span style="font-size:17px;color:#a6c6db">USDT</span></div>
    <div class="secure">✓ Secure rewards dashboard</div>
    <button class="claim" data-action="claim">Claim USDT&nbsp; →</button>
    <div class="note">Demo mode · No real funds or payouts</div>
  </section>

  <section class="stats" aria-label="Account statistics">
    <div class="stat"><div class="stat-label">Claims today</div><div class="stat-val">0 <span style="font-size:12px;color:#8fadc3">/ 1</span></div></div>
    <div class="stat"><div class="stat-label">Referral earnings</div><div class="stat-val">0.00000000</div></div>
  </section>

  <div class="section-title">Explore earning options</div>
  <section class="grid">
    <button class="tile" data-action="faucet"><div class="ico">💧</div><strong>Faucet</strong><span>Complete CAPTCHA and claim</span></button>
    <button class="tile" data-action="shortlinks"><div class="ico">🔗</div><strong>Shortlinks</strong><span>Complete eligible offers</span></button>
    <button class="tile" data-action="ads"><div class="ico">▶</div><strong>Earn more</strong><span>Approved ad rewards</span></button>
    <button class="tile" data-action="referrals"><div class="ico">🎁</div><strong>Referrals</strong><span>Invite friends to join</span></button>
    <button class="tile" data-action="withdraw"><div class="ico">👛</div><strong>Withdraw</strong><span>FaucetPay payout settings</span></button>
    <button class="tile" data-action="history"><div class="ico">↻</div><strong>History</strong><span>Claims and payout records</span></button>
  </section>
  <div class="footer">CoinSprout · Grow your rewards one claim at a time</div>
</main>

<nav class="bottom" aria-label="Main navigation">
  <button class="nav active" data-action="home"><b>⌂</b>Home</button>
  <button class="nav" data-action="tasks"><b>▤</b>Earn</button>
  <button class="nav" data-action="wallet"><b>◈</b>Wallet</button>
  <button class="nav" data-action="profile"><b>☻</b>Profile</button>
</nav>
<div class="toast" id="toast" role="status"></div>
<script>
const toast=document.getElementById('toast');let timer;
const messages={
 claim:'Demo only: CAPTCHA verification and the secure claim backend are not connected yet.',
 faucet:'Next step: connect a real CAPTCHA and server-side claim cooldown.',
 shortlinks:'Shortlink offers will be added after we confirm the provider permits incentivized traffic.',
 ads:'Ad rewards will be connected only through an approved ad format and verified completion events.',
 referrals:'Referral links and eligibility checks will be added in a later step.',
 withdraw:'FaucetPay withdrawals are disabled in demo mode. No real money is being sent.',
 history:'Claim and payout history will appear after the database is connected.',
 home:'You are on the CoinSprout home dashboard.',
 tasks:'Earning tasks are a planned feature.',
 wallet:'Wallet features are not connected in demo mode.',
 profile:'Telegram profile connection will be added after hosting and bot setup.'
};
document.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',()=>{
 const key=el.dataset.action;toast.textContent=messages[key]||'This feature is coming in a later build.';toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),3600);
 if(el.classList.contains('nav')){document.querySelectorAll('.nav').forEach(n=>n.classList.remove('active'));el.classList.add('active')}
}));
</script>
</body>
</html>
